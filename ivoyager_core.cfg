; This file can be overridden by 'res://ivoyager_override.cfg'. The resulting
; configuration defines autoload singletons, shader globals, IVCoreSettings,
; IVCoreInitializer program classes, and ivoyager_assets version and source.
;
; See comments in res://addons/ivoyager_core/ivoyager_override_template.cfg.
;
; Paths can be absolute or relative to res://addons/ivoyager_core/editor/editor_plugin.gd.

[ivoyager_assets]

version="v0.2.1.dev.20260901"
source="https://github.com/ivoyager/asset_downloads/releases/download/v0.2.1.dev.20260901/ivoyager_assets-v0.2.1.dev.20260901.zip"
size_mib=345.5
disable_asset_loader=false

[core_autoload]

IVAstronomy="../singletons/astronomy.gd"
IVGlobal="../singletons/global.gd"
IVCoreSettings="../singletons/core_settings.gd"
IVCoreInitializer="../singletons/core_initializer.gd"
IVSettingsManager="../singletons/settings_manager.gd"
IVStateManager="../singletons/state_manager.gd"

[core_shader_globals]

iv_time={
"type": "float",
"value": 0.0
}
iv_mouse_fragcoord={
"type": "vec2",
"value": Vector2(0, 0)
}
iv_fragment_id_range={
"type": "float",
"value": 0.0
}
iv_farwarp_start={
"type": "float",
"value": 0.0
}
; Viewport height at which picture-space point sizes (star field and sun) are exact. A
; project-wide convention shared by every point-sprite shader, so it lives here rather than
; on any one visual. Constant: nothing writes it at runtime.
iv_reference_viewport_height={
"type": "float",
"value": 1080.0
}
; Relative exposure of the compensating camera: 1.0 = the authored empty-sky look, and the
; constant value whenever physical light is off. IVExposureManager writes it per frame while
; active; every photometric shader multiplies it into its self-luminous output (direct light
; carries it in light_energy instead).
iv_exposure={
"type": "float",
"value": 1.0
}
iv_psf_sigma={
"type": "float",
"value": 0.5
}
; The emission map's two mutually exclusive level channels; each scales the shells.tsv column
; of the matching name, and IVExposureManager zeroes whichever one is not running. This one
; gates the by-eye channel: 1.0 whenever physical light is off, 0.0 while it is on.
iv_emission_energy_scale={
"type": "float",
"value": 1.0
}
; Rendered units per cd/m^2 (exposure x gain), which puts an emission map at the physical
; luminance its emission_luminance column asserts. IVExposureManager writes it per frame while
; active; 0.0 whenever physical light is off.
iv_emission_luminance_scale={
"type": "float",
"value": 0.0
}
; Atmosphere taste gate: 1.0 whenever physical light is off, letting a limb shell's by-eye
; atm_intensity / atm_thickness multipliers act; 0.0 while physical light is active
; (IVExposureManager), forcing both to exactly 1.0 so only the physical parameters render.
iv_limb_scale={
"type": "float",
"value": 1.0
}
; The running renderer's colour-space convention, written once by IVGraphicsManager: 0.0 where
; the renderer is linear at both ends of a shader (Forward+, Mobile), 1.0 where it is
; display-referred at both ends (Compatibility) and a shader must decode what it samples and
; encode what it writes. Read via _display.gdshaderinc, which every colour-handling shader
; includes; see that file for the convention.
iv_display_encode={
"type": "float",
"value": 0.0
}
